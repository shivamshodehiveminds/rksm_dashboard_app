<!DOCTYPE html>

            background: #f4f6f8;

        }
        .thankyou-container {
            text-align: center;

        p {

            margin-top: 20px;
            padding: 12px 20px;

            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1rem;
