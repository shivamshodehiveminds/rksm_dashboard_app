<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Entry</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.1);
        }

        h2, h3 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #5563DE;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4450b8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table th, table td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        table th {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Student Marks Entry</h2>
        <form id="studentForm">
            <label for="name">Student Name</label>
            <input type="text" id="name" placeholder="Enter student name" required>

            <label>Subject 1</label>
            <input type="number" id="sub1" min="0" max="100" required>

            <label>Subject 2</label>
            <input type="number" id="sub2" min="0" max="100" required>

            <label>Subject 3</label>
            <input type="number" id="sub3" min="0" max="100" required>

            <label>Subject 4</label>
            <input type="number" id="sub4" min="0" max="100" required>

            <label>Subject 5</label>
            <input type="number" id="sub5" min="0" max="100" required>

            <button type="submit">Add Student</button>
        </form>

        <h3>Student List</h3>
        <table id="studentTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Sub 1</th>
                    <th>Sub 2</th>
                    <th>Sub 3</th>
                    <th>Sub 4</th>
                    <th>Sub 5</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be added here -->
            </tbody>
        </table>
        <button id="finalSubmit" class="btn submit-btn">Submit All</button>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const tableBody = document.querySelector("#studentTable tbody");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const sub1 = parseInt(document.getElementById("sub1").value);
            const sub2 = parseInt(document.getElementById("sub2").value);
            const sub3 = parseInt(document.getElementById("sub3").value);
            const sub4 = parseInt(document.getElementById("sub4").value);
            const sub5 = parseInt(document.getElementById("sub5").value);
            const total = sub1 + sub2 + sub3 + sub4 + sub5;

            const row = `
                <tr>
                    <td>${name}</td>
                    <td>${sub1}</td>
                    <td>${sub2}</td>
                    <td>${sub3}</td>
                    <td>${sub4}</td>
                    <td>${sub5}</td>
                    <td>${total}</td>
                </tr>
            `;
            tableBody.innerHTML += row;

            form.reset();
        });
    </script>
</body>
</html>
